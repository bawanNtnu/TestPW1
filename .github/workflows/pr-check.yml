name: Student PR build verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          SITE_URL: https://feature-pr45-e2e-a669.bufu-workshop-qa.pages.dev
      - run: node scripts/verify-maintenance.mjs
      - run: node qa/pr45/verify-output-with-drafts.mjs --student-site .
      - run: npm ci --prefix qa/pr45 --no-audit --no-fund
      - run: npx --prefix qa/pr45 playwright install --with-deps chromium
      - run: node qa/pr45/test-navigation.mjs qa/pr45/verify-student-navigation.mjs qa-artifacts/pr45-faults
      - uses: actions/upload-artifact@v4
        with:
          name: student-pr-build
          path: |
            dist
            qa-artifacts
