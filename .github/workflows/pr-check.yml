name: Student PR build verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          SITE_URL: https://feature-pr45-maintenance-qa.bufu-workshop-qa.pages.dev
      - run: node scripts/verify-maintenance.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: student-pr-build
          path: dist
